[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plbig6"
version = "0.1.0"
description = "Análise e previsão da Premier League 2026/27 com foco nos Big 6"
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "numpy>=2.0", "scipy>=1.12", "requests>=2.31", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
